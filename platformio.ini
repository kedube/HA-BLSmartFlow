; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
custom_project_name = BLSF
custom_project_codename = Flow
custom_version = 1.5.6 # BLSF_[Major].[Feature].[Build]; incremented automatically for each firmware build
; Pinned to Arduino-ESP32 2.0.17. Arduino 3.x (IDF 5) removes the tcpip_adapter_* API that
; ESP32SSDP 1.2.1 uses, so the build fails wherever a newer platform would otherwise be chosen.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.filesystem = littlefs
build_flags = 
	-DCONFIG_ASYNC_TCP_STACK_SIZE=4096
extra_scripts = 
	pre:version_build.py
	pre:pre_build.py
	merge_firmware.py
lib_deps = 
	bblanchon/ArduinoJson@7.4.2
	https://github.com/knolleary/pubsubclient.git
	luc-github/ESP32SSDP@^1.2.1

[platformio]
build_dir = build
