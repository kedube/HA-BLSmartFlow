<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BL Smart Flow+ — Firmware Update</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <canvas id="particleCanvas"></canvas>

    <div id="container">
        <div id="header">
            <img id="logo" src="/fan.svg" alt="">
            <h1>Firmware Update</h1>
        </div>
        <div class="form-container">
            <form enctype="multipart/form-data" id="upload_form" method="post">
                <p>Upload <code>.firmware/BLSF_V&lt;version&gt;.bin.ota</code> to update the controller over Wi-Fi. The <code>.bin</code> file beside it is a full flash image for USB and can't be used here.</p>
                <label for="file1">Firmware file (.bin.ota)</label>
                <input accept='.ota' id="file1" name='firmware' type="file">
                <progress id="progressBar" max="100" value="0"></progress>
                <button id="button-send" type="submit" disabled>Update</button>
                <p class="status-pill" id="status" role="status">Status: Ready</p>
                <a class="button secondary" href="/">Back to Settings</a>
            </form>
        </div>
    </div>

    <script>
        function _(el) {
            return document.getElementById(el);
        }

        function uploadFile() {
            var file = _("file1").files[0];
            var formdata = new FormData();
            formdata.append(_("file1").name, file, file.name);
            var ajax = new XMLHttpRequest();
            ajax.upload.addEventListener("progress", progressHandler, false);
            ajax.addEventListener("load", completeHandler, false);
            ajax.addEventListener("loadstart", startHandler, false);
            ajax.addEventListener("error", errorHandler, false);
            ajax.addEventListener("abort", abortHandler, false);
            ajax.open("POST", "/update");
            // The controller accepts changes only from its own pages, which send this header.
            ajax.setRequestHeader('X-BLSmartFlow', '1');

            ajax.send(formdata);
        }
        function progressHandler(event) {
            var percent = Math.round((event.loaded / event.total) * 100);
            _("progressBar").value = percent;
        }

        function completeHandler(event) {
            var ajax = event.target;
            _("progressBar").value = 0;
            _("status").textContent = ajax.status === 200
                ? "Status: Update complete! The controller is restarting."
                : "Status: Update failed (" + (ajax.responseText || ajax.status) + "). The current firmware is still running.";
        }

        function startHandler(event) {
            _("status").textContent = "Status: Uploading...";
        }

        function errorHandler(event) {
            _("status").textContent = "Status: Error during update.";
        }

        function abortHandler(event) {
            _("status").textContent = "Status: Update aborted.";
        }

        _('upload_form').addEventListener('submit', (e) => {
            e.preventDefault();
            uploadFile();
        });

        _('file1').addEventListener('change', function(e){
            var file = _("file1").files[0];
            if (file && file.name){
                _('button-send').disabled = false;
                _("progressBar").value = 0;
            }else{
                _('button-send').disabled = true;
            }
            _('status').textContent = "Firmware Upload!";
        });
    </script>
    <script src="/particles.js"></script>
</body>
</html>
